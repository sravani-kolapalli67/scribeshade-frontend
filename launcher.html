<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launcher</title>
    <style>
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            -webkit-user-select: none;
            user-select: none;
        }
        * {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        *:focus, *:focus-visible, *:active {
            outline: none !important;
            box-shadow: none !important;
        }
        #launcher-root {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            /* CRITICAL: launcher window is now fullscreen-transparent. The
             * React tree opts in to interactivity via [data-interactive]
             * children + cursor-passthrough polling. The root MUST be
             * pointer-events:none so that elementsFromPoint() in empty
             * areas does not treat this fullscreen div as a hit target
             * — otherwise OS-level click-through never engages. */
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="launcher-root"></div>
    <script type="module" src="/src/pages/Launcher/WidgetApp.tsx"></script>
</body>

</html>
