<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Allow microphone access inside the Tauri WebView2 (Windows) and WKWebView (macOS).
         Without this, getUserMedia({ audio: true }) is silently denied by the webview's
         Permissions-Policy, which surfaces as a WebSocket "Connection error" because
         the MediaRecorder is never created and the socket handshake never completes. -->
    <meta http-equiv="Permissions-Policy" content="microphone=*, camera=()">
    <title>Floating Mini-Screen</title>
    <style>
        html, body {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            border: none !important;
            outline: none !important;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Completely remove all outlines and focus rings globally */
        * {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        *:focus, *:focus-visible, *:active {
            outline: none !important;
            box-shadow: none !important;
        }
        #mini-app-root {
            width: 100%;
            height: 100%;
            /* CRITICAL: mini window is fullscreen-transparent in the
             * unified-overlay architecture. Interactive children opt in
             * via [data-interactive] + inline pointer-events:auto. The
             * root MUST be pointer-events:none, otherwise the cursor
             * passthrough fallback (elementsFromPoint walk) finds this
             * fullscreen element and disables OS-level click-through in
             * empty regions. */
            pointer-events: none;
        }
        /*
         * Portal root — sits ABOVE the session card in the compositor stack.
         * position:fixed + inset:0 → full viewport, zero layout influence.
         * pointer-events:none → transparent to all mouse events by default;
         * individual portal children override with pointer-events:auto.
         * z-index:9000 → always above the card (auto z-index).
         * overflow:visible + isolation:isolate → clean stacking context that
         * doesn't clip fixed-positioned descendants.
         */
        #floating-portal-root {
            position: fixed;
            inset: 0;
            z-index: 9000;
            pointer-events: none;
            overflow: visible;
            isolation: isolate;
        }
    </style>
</head>

<body>
    <div id="mini-app-root"></div>
    <!-- Portal root: fixed full-viewport layer above the session card.
         Dropdowns, menus, tooltips portal here to escape card stacking context. -->
    <div id="floating-portal-root"></div>
    <script type="module" src="/src/pages/Sessions/ActiveSession/FloatingApp.tsx"></script>
</body>

</html>
