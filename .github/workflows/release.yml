name: Release ScribeShade

on:
  push:
    branches:
      - release
      - release-*

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Verify cargo is available
        shell: bash
        run: cargo --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version parity
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "package.json: $PKG_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"
          test "$PKG_VERSION" = "$TAURI_VERSION"
          test "$PKG_VERSION" = "$CARGO_VERSION"

      - name: Verify required release secrets are present
        shell: bash
        env:
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          fail=0
          check() {
            if [ -z "$2" ]; then
              echo "ERROR: $1 is empty or missing — release would be broken" >&2
              fail=1
            else
              echo "OK: $1 is present"
            fi
          }
          check VITE_DEEPGRAM_API_KEY "$VITE_DEEPGRAM_API_KEY"
          check VITE_CLERK_PUBLISHABLE_KEY "$VITE_CLERK_PUBLISHABLE_KEY"
          check TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
          exit $fail

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BACKEND_URL: "https://test.backend.scribeshade.org"
          VITE_FRONTEND_URL: "https://app.scribeshade.org"
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_CLERK_SIGN_IN_URL: /sign-in
          VITE_CLERK_SIGN_UP_URL: /sign-up
          VITE_CLERK_AFTER_SIGN_IN_URL: /dashboard
          VITE_CLERK_AFTER_SIGN_UP_URL: /dashboard
          VITE_INACTIVITY_TIMEOUT_MS: "60000"
          VITE_INACTIVITY_WARNING_MS: "30000"
        with:
          tagName: v__VERSION__
          releaseName: ScribeShade v__VERSION__
          releaseBody: |
            ## ScribeShade v__VERSION__

            Download the installer for your platform below.

            **macOS** — universal binary (Intel + Apple Silicon)
            **Windows** — x64 installer
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Validate updater artifacts (fail-fast)
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning updater artifacts..."
          find src-tauri/target -name "latest.json" -o -name "*.sig" | sed -n '1,80p'

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            test -n "$(find src-tauri/target -name 'latest.json' -print -quit)"
            test -n "$(find src-tauri/target -name 'windows-x86_64*' -name '*.sig' -print -quit)" || test -n "$(find src-tauri/target -name '*.msi.sig' -print -quit)"
          fi

          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            test -n "$(find src-tauri/target -name 'latest.json' -print -quit)"
            test -n "$(find src-tauri/target -name '*darwin-aarch64*' -name '*.sig' -print -quit)" || test -n "$(find src-tauri/target -name '*.app.tar.gz.sig' -print -quit)"
            test -n "$(find src-tauri/target -name '*darwin-x86_64*' -name '*.sig' -print -quit)" || test -n "$(find src-tauri/target -name '*.app.tar.gz.sig' -print -quit)"
          fi

          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            test -n "$(find src-tauri/target -name 'latest.json' -print -quit)"
            test -n "$(find src-tauri/target -name 'linux-x86_64*' -name '*.sig' -print -quit)" || true
          fi
