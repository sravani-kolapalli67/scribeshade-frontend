name: Release ScribeShade

on:
  push:
    branches:
      - release
      - release-*

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --config src-tauri/tauri.macos.release.conf.json
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare macOS ad-hoc release config
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          cat > src-tauri/tauri.macos.release.conf.json <<EOF
          {
            "bundle": {
              "macOS": {
                "infoPlist": "Info.plist",
                "entitlements": "entitlements.plist",
                "minimumSystemVersion": "13.0",
                "signingIdentity": "-"
              }
            }
          }
          EOF

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BACKEND_URL: "https://api.scribeshade.org"
          VITE_FRONTEND_URL: "https://app.scribeshade.org"
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_CLERK_SIGN_IN_URL: /sign-in
          VITE_CLERK_SIGN_UP_URL: /sign-up
          VITE_CLERK_AFTER_SIGN_IN_URL: /dashboard
          VITE_CLERK_AFTER_SIGN_UP_URL: /dashboard
          VITE_INACTIVITY_TIMEOUT_MS: "60000"
          VITE_INACTIVITY_WARNING_MS: "30000"
        with:
          tagName: v__VERSION__
          releaseName: ScribeShade v__VERSION__
          releaseBody: |
            ## ScribeShade v__VERSION__
            Download the installer for your platform below.
            **macOS** — universal binary (Intel + Apple Silicon)
            **Windows** — x64 installer
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Collect updater artifacts
        shell: bash
        run: |
          OUT_DIR="ci-updater/${{ matrix.platform }}"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          while IFS= read -r file; do
            cp "$file" "${OUT_DIR}/$(basename "$file")"
          done < <(
            find src-tauri/target -type f \
              \( -name "*.sig" \
              -o -name "*.tar.gz" \
              -o -name "*.zip" \
              -o -name "*.msi" \
              -o -name "*.exe" \
              -o -name "*.dmg" \
              -o -name "*.AppImage" \) 2>/dev/null
          )
          echo "Collected files:"
          find "$OUT_DIR" -type f

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-${{ matrix.platform }}
          path: ci-updater/${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 1

  publish-updater-to-vps:
    name: Publish updater to VPS
    runs-on: ubuntu-latest
    needs: publish-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-updater-*
          merge-multiple: true
          path: r2-upload

      - name: Generate latest.json
        shell: bash
        env:
          UPDATER_PUBLIC_BASE_URL: https://api.scribeshade.org/tauri-updates
        run: |
          node scripts/generate-latest-json.cjs r2-upload
          echo "Generated latest.json:"
          cat r2-upload/latest.json

      - name: Deploy to VPS via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 31.97.237.184
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "r2-upload/*"
          target: "/root/scribeshade/uploads/tauri-updates/"
          strip_components: 1
