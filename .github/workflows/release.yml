name: Release ScribeShade

on:
  push:
    branches:
      - release
      - release-*

jobs:
  precheck-release:
    name: Precheck existing release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_exists: ${{ steps.check.outputs.release_exists }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether release tag already exists
        id: check
        shell: bash
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_TOKEN_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

          TOKEN="${GH_RELEASE_TOKEN:-$GITHUB_TOKEN_DEFAULT}"
          if [ -z "${TOKEN:-}" ]; then
            echo "No GitHub token available for precheck; build will proceed."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP_STATUS=$(curl -sS -o /tmp/release_check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Release ${TAG} exists. Validating required assets..."
            CHECK_RESULT=$(node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("/tmp/release_check.json", "utf8"));
              const names = new Set((data.assets || []).map(a => a.name || ""));
              const has = (re) => [...names].some(n => re.test(n));

              const macPair = has(/\.app\.tar\.gz$/i) && has(/\.app\.tar\.gz\.sig$/i);
              const linuxTarPair = has(/\.AppImage\.tar\.gz$/i) && has(/\.AppImage\.tar\.gz\.sig$/i);
              const linuxRawPair = has(/\.AppImage$/i) && has(/\.AppImage\.sig$/i);
              const linuxPair = linuxTarPair || linuxRawPair;

              const winMsiZipPair = has(/\.msi\.zip$/i) && has(/\.msi\.zip\.sig$/i);
              const winNsisZipPair = has(/setup\.nsis\.zip$/i) && has(/setup\.nsis\.zip\.sig$/i);
              const winMsiPair = has(/\.msi$/i) && has(/\.msi\.sig$/i);
              const winExePair = has(/\.exe$/i) && has(/\.exe\.sig$/i);
              const windowsPair = winMsiZipPair || winNsisZipPair || winMsiPair || winExePair;

              if (macPair && linuxPair && windowsPair) {
                process.stdout.write("complete");
              } else {
                process.stdout.write("incomplete");
              }
            ')
            if [ "$CHECK_RESULT" = "complete" ]; then
              echo "Release ${TAG} has required updater assets. Skipping rebuild."
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "ERROR: Release ${TAG} exists but required updater artifact pairs are incomplete." >&2
              echo "ERROR: Expected pairs:" >&2
              echo "  macOS: *.app.tar.gz + *.app.tar.gz.sig" >&2
              echo "  Linux: (*.AppImage + *.AppImage.sig) OR (*.AppImage.tar.gz + *.AppImage.tar.gz.sig)" >&2
              echo "  Windows: (*.msi.zip + *.msi.zip.sig) OR (*setup.nsis.zip + *setup.nsis.zip.sig) OR (*.msi + *.msi.sig) OR (*.exe + *.exe.sig)" >&2
              exit 1
            fi
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "Release ${TAG} not found."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected status ${HTTP_STATUS}; build will proceed."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish-tauri:
    needs: precheck-release
    if: needs.precheck-release.outputs.release_exists != 'true'
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Verify cargo is available
        shell: bash
        run: cargo --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            build-essential

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version parity
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          echo "package.json: $PKG_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"
          test "$PKG_VERSION" = "$TAURI_VERSION"
          test "$PKG_VERSION" = "$CARGO_VERSION"

      - name: Verify required release secrets are present
        shell: bash
        env:
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_TOKEN_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fail=0
          check() {
            if [ -z "$2" ]; then
              echo "ERROR: $1 is empty or missing — release would be broken" >&2
              fail=1
            else
              echo "OK: $1 is present"
            fi
          }
          check VITE_DEEPGRAM_API_KEY "$VITE_DEEPGRAM_API_KEY"
          check VITE_CLERK_PUBLISHABLE_KEY "$VITE_CLERK_PUBLISHABLE_KEY"
          check TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
          if [ -n "$GH_RELEASE_TOKEN" ]; then
            echo "OK: GH_RELEASE_TOKEN is present (preferred for release API)."
          elif [ -n "$GITHUB_TOKEN_DEFAULT" ]; then
            echo "OK: falling back to default GITHUB_TOKEN."
          else
            echo "ERROR: no GitHub token available for release API." >&2
            fail=1
          fi
          exit $fail

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN != '' && secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BACKEND_URL: "https://test.backend.scribeshade.org"
          VITE_FRONTEND_URL: "https://app.scribeshade.org"
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_CLERK_SIGN_IN_URL: /sign-in
          VITE_CLERK_SIGN_UP_URL: /sign-up
          VITE_CLERK_AFTER_SIGN_IN_URL: /dashboard
          VITE_CLERK_AFTER_SIGN_UP_URL: /dashboard
          VITE_INACTIVITY_TIMEOUT_MS: "60000"
          VITE_INACTIVITY_WARNING_MS: "30000"
        with:
          tagName: v__VERSION__
          releaseName: ScribeShade v__VERSION__
          releaseBody: |
            ## ScribeShade v__VERSION__

            Download the installer for your platform below.

            **macOS** — universal binary (Intel + Apple Silicon)
            **Windows** — x64 installer
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Validate updater artifacts (fail-fast)
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning updater artifacts..."
          find src-tauri/target -type f \( -name "*.sig" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.app.tar.gz" \) | sed -n '1,160p'

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            if test -n "$(find src-tauri/target -name '*.msi.zip' -print -quit)" && test -n "$(find src-tauri/target -name '*.msi.zip.sig' -print -quit)"; then
              echo "OK: Windows MSI zip updater pair found"
            elif test -n "$(find src-tauri/target -name '*setup.nsis.zip' -print -quit)" && test -n "$(find src-tauri/target -name '*setup.nsis.zip.sig' -print -quit)"; then
              echo "OK: Windows NSIS zip updater pair found"
            elif test -n "$(find src-tauri/target -name '*.msi' -print -quit)" && test -n "$(find src-tauri/target -name '*.msi.sig' -print -quit)"; then
              echo "OK: Windows MSI updater pair found"
            elif test -n "$(find src-tauri/target -name '*.exe' -print -quit)" && test -n "$(find src-tauri/target -name '*.exe.sig' -print -quit)"; then
              echo "OK: Windows EXE updater pair found"
            else
              echo "ERROR: Windows updater artifact pair missing"
              exit 1
            fi
          fi

          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            test -n "$(find src-tauri/target -name '*.app.tar.gz' -print -quit)"
            test -n "$(find src-tauri/target -name '*.app.tar.gz.sig' -print -quit)"
            echo "OK: macOS updater pair found"
          fi

          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            if test -n "$(find src-tauri/target -name '*.AppImage' -print -quit)" && test -n "$(find src-tauri/target -name '*.AppImage.sig' -print -quit)"; then
              echo "OK: Linux AppImage updater pair found"
            elif test -n "$(find src-tauri/target -name '*.AppImage.tar.gz' -print -quit)" && test -n "$(find src-tauri/target -name '*.AppImage.tar.gz.sig' -print -quit)"; then
              echo "OK: Linux AppImage tar updater pair found"
            else
              echo "ERROR: Linux updater artifact pair missing"
              exit 1
            fi
          fi

      - name: Collect updater artifacts for R2 publish
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="ci-updater/${{ matrix.platform }}"
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          while IFS= read -r file; do
            cp "$file" "${OUT_DIR}/$(basename "$file")"
          done < <(
            find src-tauri/target -type f \
              \( -name "*.sig" \
              -o -name "*.tar.gz" \
              -o -name "*.zip" \
              -o -name "*.msi" \
              -o -name "*.exe" \
              -o -name "*.dmg" \
              -o -name "*.AppImage" \
              -o -name "*.deb" \
              -o -name "*.rpm" \)
          )

          echo "Collected files:"
          find "$OUT_DIR" -type f | sed -n '1,200p'

      - name: Upload updater artifacts bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-${{ matrix.platform }}
          path: ci-updater/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  publish-updater-to-r2:
    name: Publish updater artifacts to Cloudflare R2
    runs-on: ubuntu-latest
    needs:
      - precheck-release
      - publish-tauri
    if: always() && needs.precheck-release.result == 'success' && (needs.publish-tauri.result == 'success' || needs.publish-tauri.result == 'skipped')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download matrix updater artifacts
        if: needs.publish-tauri.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-updater-*
          merge-multiple: true
          path: r2-upload

      - name: Download updater assets from existing GitHub release
        if: needs.publish-tauri.result == 'skipped'
        shell: bash
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GITHUB_TOKEN_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.precheck-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p r2-upload

          TOKEN="${GH_RELEASE_TOKEN:-$GITHUB_TOKEN_DEFAULT}"
          if [ -z "${TOKEN:-}" ]; then
            echo "ERROR: No GitHub token available to download release assets." >&2
            exit 1
          fi

          API_URL="https://api.github.com/repos/${REPO}/releases/tags/${RELEASE_TAG}"
          curl -fsSL \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            -o /tmp/release.json

          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/release.json", "utf8"));
            const wanted = /\.(sig|app\.tar\.gz|AppImage\.tar\.gz|msi\.zip|setup\.nsis\.zip|msi|exe|dmg|deb|rpm|AppImage|latest\.json)$/i;
            const assets = (data.assets || [])
              .filter(a => wanted.test(a.name || ""))
              .map(a => ({ name: a.name, apiUrl: a.url }));
            fs.writeFileSync(
              "/tmp/release_urls.txt",
              assets.map(a => `${a.name}\t${a.apiUrl}`).join("\n") + (assets.length ? "\n" : "")
            );
            console.log(`[release-assets] selected ${assets.length} assets from ${data.tag_name}`);
          '

          if [ ! -s /tmp/release_urls.txt ]; then
            echo "ERROR: No matching assets found in release ${RELEASE_TAG}." >&2
            exit 1
          fi

          while IFS=$'\t' read -r file api_url; do
            [ -z "${file:-}" ] && continue
            [ -z "${api_url:-}" ] && continue
            echo "Downloading $file"
            curl -fsSL \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o "r2-upload/${file}" \
              "$api_url"
          done < /tmp/release_urls.txt

          echo "Release assets downloaded:"
          find r2-upload -type f | sed -n '1,250p'

      - name: Remove non-updater files from upload folder
        shell: bash
        run: |
          set -euo pipefail
          find r2-upload -type f \
            ! -name "*.sig" \
            ! -name "latest.json" \
            ! -name "*.app.tar.gz" \
            ! -name "*.AppImage.tar.gz" \
            ! -name "*.msi.zip" \
            ! -name "*setup.nsis.zip" \
            ! -name "*.msi" \
            ! -name "*.exe" \
            ! -name "*.dmg" \
            ! -name "*.deb" \
            ! -name "*.rpm" \
            ! -name "*.AppImage" \
            -delete

      - name: Generate latest.json for public R2 URL
        shell: bash
        env:
          UPDATER_PUBLIC_BASE_URL: https://pub-992f115513ba42f681595c2ca5fac628.r2.dev/tauri-updates
        run: |
          set -euo pipefail
          node scripts/generate-latest-json.cjs r2-upload

      - name: Verify R2 secrets are present
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -z "$2" ]; then
              echo "ERROR: $1 is empty or missing" >&2
              fail=1
            else
              echo "OK: $1 is present"
            fi
          }
          check CLOUDFLARE_R2_ACCOUNT_ID "$CLOUDFLARE_R2_ACCOUNT_ID"
          check CLOUDFLARE_R2_ACCESS_KEY_ID "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          check CLOUDFLARE_R2_SECRET_ACCESS_KEY "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          check CLOUDFLARE_R2_BUCKET "$CLOUDFLARE_R2_BUCKET"

          # R2 S3 credential sanity checks (prevents opaque AWS CLI failures).
          AKI_LEN=${#CLOUDFLARE_R2_ACCESS_KEY_ID}
          SAK_LEN=${#CLOUDFLARE_R2_SECRET_ACCESS_KEY}
          if [ "$AKI_LEN" -ne 32 ]; then
            echo "ERROR: CLOUDFLARE_R2_ACCESS_KEY_ID length is $AKI_LEN (expected 32). You likely pasted the wrong value." >&2
            fail=1
          else
            echo "OK: CLOUDFLARE_R2_ACCESS_KEY_ID length looks valid (32)."
          fi
          if [ "$SAK_LEN" -lt 40 ]; then
            echo "ERROR: CLOUDFLARE_R2_SECRET_ACCESS_KEY looks too short ($SAK_LEN)." >&2
            fail=1
          else
            echo "OK: CLOUDFLARE_R2_SECRET_ACCESS_KEY length looks valid."
          fi
          exit $fail

      - name: Ensure latest.json exists in upload bundle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find r2-upload -type f -name latest.json -print -quit)"
          echo "Found latest.json and updater files."
          find r2-upload -type f | sed -n '1,250p'

      - name: Upload updater files to temporary R2 prefix
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TMP_PREFIX="tauri-updates-tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Using temporary prefix: ${TMP_PREFIX}"
          aws s3 rm "s3://${CLOUDFLARE_R2_BUCKET}/${TMP_PREFIX}/" \
            --recursive \
            --endpoint-url "$ENDPOINT" || true
          aws s3 sync r2-upload/ "s3://${CLOUDFLARE_R2_BUCKET}/${TMP_PREFIX}/" \
            --endpoint-url "$ENDPOINT"

      - name: Replace live R2 updater prefix with temporary artifacts
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TMP_PREFIX="tauri-updates-tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 sync "s3://${CLOUDFLARE_R2_BUCKET}/${TMP_PREFIX}/" "s3://${CLOUDFLARE_R2_BUCKET}/tauri-updates/" \
            --delete \
            --endpoint-url "$ENDPOINT"

      - name: Clean up temporary R2 prefix
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TMP_PREFIX="tauri-updates-tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws s3 rm "s3://${CLOUDFLARE_R2_BUCKET}/${TMP_PREFIX}/" \
            --recursive \
            --endpoint-url "$ENDPOINT" || true

      - name: List uploaded updater files
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 ls "s3://${CLOUDFLARE_R2_BUCKET}/tauri-updates/" \
            --recursive \
            --endpoint-url "$ENDPOINT"
